<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tomate — a slow pomodoro</title>
  <meta name="description" content="A pomodoro timer drawn as a living tomato that shrinks while you focus." />
  <meta name="theme-color" content="#F6EEE6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15120F" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23FF5400'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-mode="focus">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true"></div>

  <header class="top">
    <div class="mark">Tomate<sup>®</sup></div>
    <p class="tag"><em>A slow pomodoro.</em> Focus until the fruit is gone.</p>
    <div class="rounds" aria-label="Rounds">
      <span class="label">Round</span>
      <span id="roundNum" class="num">01</span>
      <span class="dots" id="dots"><i></i><i></i><i></i><i></i></span>
    </div>
  </header>

  <main class="stage">
    <p class="kicker" id="kicker">Focus</p>
    <h1 class="time" id="time" aria-live="off">
      <span class="d"><b>2</b></span><span class="d"><b>5</b></span><span class="colon">:</span><span class="d"><b>0</b></span><span class="d"><b>0</b></span>
    </h1>
    <p class="status" id="status" aria-live="polite">Ready when you are.</p>
  </main>

  <footer class="bottom">
    <nav class="modes" aria-label="Mode">
      <button data-mode="focus" aria-pressed="true"><span>01</span>Focus</button>
      <button data-mode="short" aria-pressed="false"><span>02</span>Short break</button>
      <button data-mode="long" aria-pressed="false"><span>03</span>Long break</button>
    </nav>

    <div class="controls">
      <button class="ghost" id="reset" aria-label="Reset">Reset</button>
      <button class="primary" id="toggle"><span id="toggleLabel">Start</span></button>
      <button class="ghost" id="skip" aria-label="Skip to next">Skip</button>
    </div>

    <p class="keys"><kbd>Space</kbd> start/pause <kbd>R</kbd> reset <kbd>S</kbd> skip <kbd>1–3</kbd> mode</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
